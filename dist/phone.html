<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nav Prototype – Mobile</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #1c1c1e;
      font-family: -apple-system, sans-serif;
      padding: 32px 16px;
    }

    .label {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }

    .phone {
      position: relative;
      width: 393px;
      height: 852px;
      background: #000;
      border-radius: 54px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.12),
        0 40px 100px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* Side buttons */
    .phone::before {
      content: '';
      position: absolute;
      left: -3px;
      top: 160px;
      width: 3px;
      height: 36px;
      background: #3a3a3c;
      border-radius: 2px 0 0 2px;
      box-shadow: 0 50px 0 #3a3a3c, 0 100px 0 #3a3a3c;
    }
    .phone::after {
      content: '';
      position: absolute;
      right: -3px;
      top: 190px;
      width: 3px;
      height: 72px;
      background: #3a3a3c;
      border-radius: 0 2px 2px 0;
    }

    .screen {
      position: absolute;
      inset: 0;
      border-radius: 54px;
      overflow: hidden;
      background: white;
    }

    /* Dynamic island */
    .island {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 34px;
      background: #000;
      border-radius: 20px;
      z-index: 10;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 54px;
    }
  </style>
</head>
<body>
  <p class="label">Mobile prototype</p>
  <div class="phone">
    <div class="screen">
      <div class="island"></div>
      <iframe src="./mobile/" title="Mobile nav prototype"></iframe>
    </div>
  </div>
</body>
</html>
