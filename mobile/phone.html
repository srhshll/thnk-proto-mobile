<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nav Prototype – Mobile</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: -apple-system, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
    }

    .label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      flex-shrink: 0;
    }

    /* Wrapper holds the scaled layout size so flex stays centered */
    .device-wrap {
      flex-shrink: 0;
      transform-origin: top left;
    }

    /* Outer phone shell */
    .device {
      position: relative;
      width: 417px;
      height: 902px;
      transform-origin: top left;
      filter: drop-shadow(0 32px 72px rgba(0,0,0,0.85));
    }

    /* Screen area — status bar + iframe live here */
    .device__screen {
      position: absolute;
      left: 12px;
      top: 25px;
      width: 393px;
      height: 852px;
      border-radius: 44px;
      overflow: hidden;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    /* iOS-style status bar */
    .status-bar {
      flex-shrink: 0;
      height: 59px;
      background: #fff;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 28px 10px;
      position: relative;
      z-index: 2;
    }

    .status-bar__time {
      font-family: -apple-system, 'SF Pro Display', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: #000;
      letter-spacing: -0.3px;
    }

    .status-bar__icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .device__screen iframe {
      flex: 1;
      width: 100%;
      border: none;
      display: block;
    }

    /* SVG bezel sits on top, pointer-events: none so iframe stays interactive */
    .device__bezel {
      position: absolute;
      inset: 0;
      overflow: visible;
      pointer-events: none;
    }

    /* Side hardware buttons */
    .device__btn {
      position: absolute;
      background: #2a2a2c;
      border-radius: 2px;
      pointer-events: none;
    }
    .device__btn--vol-up   { left: -4px; top: 148px; width: 4px; height: 32px; border-radius: 2px 0 0 2px; }
    .device__btn--vol-down { left: -4px; top: 192px; width: 4px; height: 32px; border-radius: 2px 0 0 2px; }
    .device__btn--power    { right: -4px; top: 178px; width: 4px; height: 72px; border-radius: 0 2px 2px 0; }
  </style>
</head>
<body>
  <p class="label">Mobile prototype</p>
  <div class="device-wrap">
  <div class="device">

    <!-- Screen: status bar + prototype iframe -->
    <div class="device__screen">
      <!-- iOS status bar -->
      <div class="status-bar">
        <span class="status-bar__time">9:41</span>
        <div class="status-bar__icons">
          <!-- Signal bars -->
          <svg width="17" height="12" viewBox="0 0 17 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#000"/>
            <rect x="4.5" y="5.5" width="3" height="6.5" rx="0.5" fill="#000"/>
            <rect x="9" y="3" width="3" height="9" rx="0.5" fill="#000"/>
            <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#000"/>
          </svg>
          <!-- WiFi -->
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 9.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5z" fill="#000"/>
            <path d="M3.9 6.6A5.84 5.84 0 0 1 8 5c1.56 0 2.98.61 4.1 1.6" stroke="#000" stroke-width="1.3" stroke-linecap="round" fill="none"/>
            <path d="M1.1 3.8A9.73 9.73 0 0 1 8 1c2.65 0 5.07 1.05 6.9 2.8" stroke="#000" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          </svg>
          <!-- Battery -->
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="#000" stroke-opacity="0.35"/>
            <rect x="2" y="2" width="16" height="8" rx="1.5" fill="#000"/>
            <path d="M22.5 4v4a2 2 0 0 0 0-4z" fill="#000" fill-opacity="0.4"/>
          </svg>
        </div>
      </div>
      <iframe src="./mobile/" title="Mobile nav prototype"></iframe>
    </div>

    <!-- Phone bezel SVG — draws over the iframe -->
    <svg class="device__bezel" viewBox="0 0 417 902" xmlns="http://www.w3.org/2000/svg">
      <!-- Bezel fill: outer shape minus screen hole (evenodd creates the cutout) -->
      <path
        fill="#1c1c1e"
        fill-rule="evenodd"
        d="
          M54,0 H363 A54,54 0 0,1 417,54 V848 A54,54 0 0,1 363,902 H54 A54,54 0 0,1 0,848 V54 A54,54 0 0,1 54,0 Z
          M56,25 H361 A44,44 0 0,1 405,69 V833 A44,44 0 0,1 361,877 H56 A44,44 0 0,1 12,833 V69 A44,44 0 0,1 56,25 Z
        "
      />
      <!-- Outer edge highlight -->
      <path
        fill="none"
        stroke="rgba(255,255,255,0.08)"
        stroke-width="1"
        d="M54,0.5 H363 A53.5,53.5 0 0,1 416.5,54 V848 A53.5,53.5 0 0,1 363,901.5 H54 A53.5,53.5 0 0,1 0.5,848 V54 A53.5,53.5 0 0,1 54,0.5 Z"
      />
      <!-- Dynamic island -->
      <rect x="145.5" y="38" width="126" height="37" rx="18.5" fill="#000"/>
      <!-- Home indicator -->
      <rect x="168" y="864" width="81" height="5" rx="2.5" fill="rgba(255,255,255,0.18)"/>
    </svg>

    <!-- Side buttons -->
    <div class="device__btn device__btn--vol-up"></div>
    <div class="device__btn device__btn--vol-down"></div>
    <div class="device__btn device__btn--power"></div>
  </div>
  </div><!-- /.device-wrap -->

  <script>
    const DEVICE_W = 417, DEVICE_H = 902;
    const wrap = document.querySelector('.device-wrap');
    const device = document.querySelector('.device');
    function fit() {
      const pad = 32, labelH = 10 + 14; // gap + label
      const availW = window.innerWidth - pad;
      const availH = window.innerHeight - pad - labelH;
      const scale = Math.min(availW / DEVICE_W, availH / DEVICE_H, 1);
      device.style.transform = `scale(${scale})`;
      wrap.style.width  = (DEVICE_W * scale) + 'px';
      wrap.style.height = (DEVICE_H * scale) + 'px';
    }
    fit();
    window.addEventListener('resize', fit);
  </script>
</body>
</html>
